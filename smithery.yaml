# Smithery configuration for Consulta de Multas
# Schema: https://smithery.ai/docs/build/project-config
# Remote HTTP MCP — server hosted at https://api.mcp.ai/p_multas

name: multas-mcp
displayName: "Consulta de Multas"
description: >
  Consulta de dados PÚBLICOS de veículos e trânsito em bases oficiais, a mesma informação que o cidadão acessa no DETRAN/PRF: débitos (IPVA, licenciamento, multas em aberto) e infrações por placa/RENAVAM, veículos no nome do proprietário e situação da CNH. Feito para o titular consultar o próprio veículo/habilitação. Hospedado pela plataforma, sem credenciais, pague por consulta com crédito pré-pago.

version: 0.1.0
license: MIT
homepage: https://github.com/mcp-dir/multas-mcp
repository: https://github.com/mcp-dir/multas-mcp

tags:
  - multas
  - brazil
  - horizontal
  - read-only

# Remote HTTP MCP — sem startCommand local (servidor já hospedado)
startCommand:
  type: http
  url: https://api.mcp.ai/p_multas

auth:
  type: oauth2
  resourceMetadataUrl: https://api.mcp.ai/p_multas/.well-known/oauth-protected-resource
  fallback:
    type: agent-auth
    description: >
      Para clientes sem OAuth 2.1. O agente expõe uma tool authenticate(token).
      Usuário gera o JWT em https://app.mcp.ai/agent-auth e cola no chat.
